[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-ai-adviser-poc"
version = "0.1.0"
description = "Japanese equity data acquisition and visualization PoC"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1,<2",
  "openpyxl>=3.1,<4",
  "openai>=1.101,<3",
  "pandas>=2.1,<3",
  "pydantic>=2.8,<3",
  "plotly>=5.20,<7",
  "pypdf>=5,<7",
  "pyarrow>=17,<25",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
  "streamlit>=1.38,<2",
  "xlrd>=2.0,<3",
  "yfinance>=0.2.66,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
report = [
  "matplotlib>=3.9,<4",
  "pdfplumber>=0.11,<1",
  "reportlab>=4.2,<5",
]

[project.scripts]
asset-poc = "asset_poc.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
